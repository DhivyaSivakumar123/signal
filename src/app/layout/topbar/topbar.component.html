<header class="topbar">
  <!-- Left: hamburger + wordmark -->
  <div class="topbar__left">
    <button class="topbar__menu-btn" *ngIf="!isTriagePage()" (click)="toggleSidebar()">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="topbar__wordmark">SIGNAL</span>
  </div>

  <!-- Center: empty space where search bar was -->

  <!-- Right: notification bell + avatar -->
  <div class="topbar__right">
    <button class="topbar__icon-btn" matTooltip="Send digest now" (click)="sendDigest()">
      <mat-icon>notifications_none</mat-icon>
    </button>
    <div class="topbar__avatar" [matTooltip]="user?.email ?? ''" (click)="openUserMenu()">
      <img *ngIf="user?.pictureUrl" [src]="user.pictureUrl" class="topbar__avatar-img" [alt]="user?.name" />
      <span *ngIf="!user?.pictureUrl" class="topbar__avatar-initials">{{ userInitials }}</span>
      <span class="topbar__avatar-badge topbar__avatar-badge--{{ user?.oauthProvider?.toLowerCase() }}"
            *ngIf="user?.oauthProvider === 'GOOGLE' || user?.oauthProvider === 'MICROSOFT'">
        {{ user?.oauthProvider === 'GOOGLE' ? 'G' : 'M' }}
      </span>
    </div>
    <!-- User dropdown menu -->
    <div class="topbar__user-menu" *ngIf="userMenuOpen">
      <div class="user-menu__header">
        <div class="user-menu__avatar-wrap">
          <img *ngIf="user?.pictureUrl" [src]="user.pictureUrl" class="user-menu__avatar-img" [alt]="user?.name" />
          <div *ngIf="!user?.pictureUrl" class="user-menu__avatar-initials">{{ userInitials }}</div>
          <span class="user-menu__avatar-badge user-menu__avatar-badge--{{ user?.oauthProvider?.toLowerCase() }}"
                *ngIf="user?.oauthProvider === 'GOOGLE' || user?.oauthProvider === 'MICROSOFT'">
            {{ user?.oauthProvider === 'GOOGLE' ? 'G' : 'M' }}
          </span>
        </div>
        <span class="user-menu__name">{{ user?.name }}</span>
        <span class="user-menu__email">{{ user?.email }}</span>
      </div>
      <div class="user-menu__divider"></div>
      <button class="user-menu__item user-menu__item--danger" (click)="logout()">Sign out</button>
    </div>
  </div>
</header>
