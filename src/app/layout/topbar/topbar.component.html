<header class="topbar">
  <!-- Left: hamburger + wordmark -->
  <div class="topbar__left">
    <button class="topbar__menu-btn" *ngIf="!isTriagePage()" (click)="toggleSidebar()">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="topbar__wordmark">SIGNAL</span>
  </div>

  <!-- Center: empty space where search bar was -->

  <!-- Right: notification bell + avatar -->
  <div class="topbar__right">
    <button class="topbar__icon-btn" matTooltip="Send digest now" (click)="sendDigest()">
      <mat-icon>notifications_none</mat-icon>
    </button>
    <div class="topbar__avatar" [matTooltip]="user?.email ?? ''" (click)="openUserMenu()">
      <img *ngIf="resolvedAvatarUrl" [src]="resolvedAvatarUrl" class="topbar__avatar-img" [alt]="user?.name" />
      <span *ngIf="!resolvedAvatarUrl" class="topbar__avatar-initials">{{ userInitials }}</span>
      <span class="topbar__avatar-badge topbar__avatar-badge--{{ user?.oauthProvider?.toLowerCase() }}"
            *ngIf="user?.oauthProvider === 'GOOGLE' || user?.oauthProvider === 'MICROSOFT'">
        <svg *ngIf="user?.oauthProvider === 'GOOGLE'" viewBox="0 0 24 24" class="provider-logo-svg"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        <svg *ngIf="user?.oauthProvider === 'MICROSOFT'" viewBox="0 0 23 23" class="provider-logo-svg"><rect x="0" y="0" width="10" height="10" fill="#F25022"/><rect x="12" y="0" width="10" height="10" fill="#7FBA00"/><rect x="0" y="12" width="10" height="10" fill="#00A4EF"/><rect x="12" y="12" width="10" height="10" fill="#FFB900"/></svg>
      </span>
    </div>
    <!-- User dropdown menu -->
    <div class="topbar__user-menu" *ngIf="userMenuOpen">
      <div class="user-menu__header">
        <div class="user-menu__avatar-wrap">
          <img *ngIf="resolvedAvatarUrl" [src]="resolvedAvatarUrl" class="user-menu__avatar-img" [alt]="user?.name" />
          <div *ngIf="!resolvedAvatarUrl" class="user-menu__avatar-initials">{{ userInitials }}</div>
          <span class="user-menu__avatar-badge user-menu__avatar-badge--{{ user?.oauthProvider?.toLowerCase() }}"
                *ngIf="user?.oauthProvider === 'GOOGLE' || user?.oauthProvider === 'MICROSOFT'">
            <svg *ngIf="user?.oauthProvider === 'GOOGLE'" viewBox="0 0 24 24" class="provider-logo-svg"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            <svg *ngIf="user?.oauthProvider === 'MICROSOFT'" viewBox="0 0 23 23" class="provider-logo-svg"><rect x="0" y="0" width="10" height="10" fill="#F25022"/><rect x="12" y="0" width="10" height="10" fill="#7FBA00"/><rect x="0" y="12" width="10" height="10" fill="#00A4EF"/><rect x="12" y="12" width="10" height="10" fill="#FFB900"/></svg>
          </span>
        </div>
        <span class="user-menu__name">{{ user?.name }}</span>
        <span class="user-menu__email">{{ user?.email }}</span>
      </div>
      <div class="user-menu__divider"></div>
      <button class="user-menu__item user-menu__item--danger" (click)="logout()">Sign out</button>
    </div>
  </div>
</header>
